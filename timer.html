<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Gateway</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            text-align: center;
            background: #1a1a1a;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 340px;
        }
        h1 { font-size: 1.4rem; margin-bottom: 0.4rem; }
        p { color: #888; font-size: 0.95rem; margin-bottom: 2rem; }
        #timer {
            font-size: 5rem;
            font-weight: 800;
            color: #E1306C;
            margin-bottom: 2rem;
            line-height: 1;
        }
        button {
            background: #2a2a2a;
            color: #aaa;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
        }
        button:active { background: #3a3a3a; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hold On</h1>
        <p>Give your brain a second...</p>
        <div id="timer">10</div>
        <button onclick="window.location.href='about:blank'">Cancel</button>
    </div>

    <script>
        let timeLeft = 10;
        const timerDisplay = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = 'https://www.instagram.com/direct/inbox/?__pwa=1';
            }
        }, 1000);
    </script>
</body>
</html>
